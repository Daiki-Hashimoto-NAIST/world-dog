<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>世界共有犬</title>
</head>

<body>
    <h1>🐶 いぬ</h1>
    <h2 id="mood">😄</h2>

    <p>ごはん：<span id="food">50</span></p>
    <p>みず：<span id="water">50</span></p>
    <p>げんき：<span id="energy">100</span></p>
    <p>ねむけ：<span id="sleepiness">50</span></p>

    <div class="action-buttons">
        <button onclick="feedDog()">ごはんをあげる</button>
        <button onclick="waterDog()">水をあげる</button>
        <button onclick="walkDog()">散歩する</button>
        <button onclick="sleepDog()">寝る</button>
    </div>
    <div class="debug-buttons">
        <button onclick="debugChange('food', 10)">+ご飯</button>
        <button onclick="debugChange('food', -10)">-ご飯</button>
        <button onclick="debugChange('water', 10)">+水</button>
        <button onclick="debugChange('water', -10)">-水</button>
        <button onclick="debugChange('energy', 10)">+元気</button>
        <button onclick="debugChange('energy', -10)">-元気</button>
        <button onclick="debugChange('sleepiness', 10)">+ねむけ</button>
        <button onclick="debugChange('sleepiness', -10)">-ねむけ</button>
    </div>

    <style>
        .action-buttons button {
            margin: 10px;
            padding: 10px;
        }

        .debug-buttons button {
            margin: 5px;
            padding: 5px;
        }
    </style>

    <script>
        let dog = {
            food: localStorage.getItem("food"),
            water: localStorage.getItem("water"),
            energy: localStorage.getItem("energy"),
            sleepiness: localStorage.getItem("sleepiness"),
        }

        function debugChange(stat, amount) {
            dog[stat] = Math.min(100, Math.ceil(dog[stat] / 10) * 10 + amount);
            updataAll();
        }

        if (dog.food === null) {
            dog.food = 50;
        } else {
            dog.food = Number(dog.food);
        }

        if (dog.water === null) {
            dog.water = 50;
        } else {
            dog.water = Number(dog.water);
        }

        if (dog.energy === null) {
            dog.energy = 100;
        } else {
            dog.energy = Number(dog.energy);
        }

        if (dog.sleepiness === null) {
            dog.sleepiness = 50;
        } else {
            dog.sleepiness = Number(dog.sleepiness);
        }

        updataAll();


        function updataDisplay() {
            document.getElementById("food").textContent = dog.food;
            document.getElementById("water").textContent = dog.water;
            document.getElementById("energy").textContent = dog.energy;
            document.getElementById("sleepiness").textContent = dog.sleepiness;
            document.getElementById("mood").textContent = getMood();
        }

        function saveData() {
            localStorage.setItem("food", dog.food);
            localStorage.setItem("water", dog.water);
            localStorage.setItem("energy", dog.energy);
            localStorage.setItem("sleepiness", dog.sleepiness);
        }

        function updataAll() {
            clampStats();
            updataDisplay();
            saveData();
        }

        function updataStats() {
            dog.food = Math.max(dog.food - 1, 0);
            dog.water = Math.max(dog.water - 1, 0);
            dog.energy = Math.max(dog.energy - 1, 0);
            dog.sleepiness = Math.min(dog.sleepiness + 1, 100);
        }

        function feedDog() {
            modifyStats({ food: 10 });
        }

        function waterDog() {
            modifyStats({ water: 10 });
        }

        function walkDog() {
            modifyStats({ energy: -10, food: -10, water: -5, sleepiness: 10 });
        }

        function sleepDog() {
            modifyStats({ sleepiness: -20, energy: 20, food: -10, water: -5 });
        }

        function clampStats() {
            dog.food = Math.max(dog.food, 0);
            dog.water = Math.max(dog.water, 0);
            dog.energy = Math.max(dog.energy, 0);
            dog.sleepiness = Math.max(dog.sleepiness, 0);

            dog.food = Math.min(dog.food, 100);
            dog.water = Math.min(dog.water, 100);
            dog.energy = Math.min(dog.energy, 100);
            dog.sleepiness = Math.min(dog.sleepiness, 100);
        }

        function modifyStats(changes) {
            dog.food += changes.food || 0;
            dog.water += changes.water || 0;
            dog.energy += changes.energy || 0;
            dog.sleepiness += changes.sleepiness || 0;
            updataAll();
        }

        function getMood() {
            // 特殊状態
            if (
                dog.food === 100 &&
                dog.water === 100 &&
                dog.energy === 100 &&
                dog.sleepiness === 0
            ) return "🤩"

            if (
                dog.food === 0 &&
                dog.water === 0 &&
                dog.energy === 0
            ) return "😇"

            if (
                dog.food > 90 &&
                dog.water > 90 &&
                dog.energy < 10
            ) return "🍖"

            if (dog.food < 10) return "🤤"
            if (dog.water < 10) return "🥵"
            if (dog.energy < 10) return "😑"
            if (dog.sleepiness > 90) return "😴"

            // 総合評価
            let moodScore =
                dog.food * 1.5 +
                dog.water * 1.5 +
                dog.energy * 1.0 +
                (100 - dog.sleepiness) * 0.8;

            moodScore += Math.min(
                dog.food,
                dog.water,
                dog.energy,
                (100 - dog.sleepiness)
            );

            if (moodScore < 48) return "😩";
            if (moodScore < 96) return "😔";
            if (moodScore < 144) return "🙁";
            if (moodScore < 192) return "😐";
            if (moodScore < 240) return "🙂";
            if (moodScore < 288) return "😊";
            if (moodScore < 336) return "😄";
            if (moodScore < 384) return "😁";
            return "😆";
        }

        updataDisplay()

        setInterval(() => {
            updataStats()
            updataDisplay()
            saveData()
        }, 10000);

    </script>
</body>

</html>
