<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>世界共有犬</title>
</head>

<body>
    <h1>🐶 いぬ</h1>

    <p>満腹度：<span id="food">50</span></p>

    <button onclick="feelDog()">犬に餌をあげる</button>

    <script>
        let food = localStorage.getItem("food");

        if (food === null) {
            food = 50;
        } else {
            food = Number(food);
        }

        document.getElementById("food").textContent = food;

        function feelDog() {
            food += 10;
            document.getElementById("food").textContent = food;

            localStorage.setItem("food", food);
        }
    </script>
</body>

</html>
