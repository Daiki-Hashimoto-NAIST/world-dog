<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>世界共有犬</title>
</head>

<body>
    <h1>🐶 いぬ</h1>
    <h2 id="mood">😄</h2>

    <p>ごはん：<span id="food">50</span></p>
    <p>みず：<span id="water">50</span></p>
    <p>げんき：<span id="energy">100</span></p>
    <p>ねむけ：<span id="sleepiness">50</span></p>

    <button onclick="feedDog()">ごはんをあげる</button>
    <button onclick="waterDog()">水をあげる</button>
    <button onclick="walkDog()">散歩する</button>
    <button onclick="sleepDog()">寝る</button>

    <button onclick="food += 10; updataDisplay()">+ご飯</button>
    <button onclick="food -= 10; updataDisplay()">-ご飯</button>
    <button onclick="water += 10; updataDisplay()">+水</button>
    <button onclick="water -= 10; updataDisplay()">-水</button>
    <button onclick="energy += 10; updataDisplay()">+元気</button>
    <button onclick="energy -= 10; updataDisplay()">-元気</button>
    <button onclick="sleepiness += 10; updataDisplay()">+ねむけ</button>
    <button onclick="sleepiness -= 10; updataDisplay()">-ねむけ</button>

    <script>
        updataDisplay();

        let food = localStorage.getItem("food");
        let water = localStorage.getItem("water");
        let energy = localStorage.getItem("energy");
        let sleepiness = localStorage.getItem("sleepiness");

        if (food === null) {
            food = 50;
        } else {
            food = Number(food);
        }

        if (water === null) {
            water = 50;
        } else {
            water = Number(water);
        }

        if (energy === null) {
            energy = 100;
        } else {
            energy = Number(energy);
        }

        if (sleepiness === null) {
            sleepiness = 50;
        } else {
            sleepiness = Number(sleepiness);
        }

        document.getElementById("food").textContent = food;
        document.getElementById("water").textContent = water;
        document.getElementById("energy").textContent = energy;
        document.getElementById("sleepiness").textContent = sleepiness;


        function updataDisplay() {
            document.getElementById("food").textContent = food;
            document.getElementById("water").textContent = water;
            document.getElementById("energy").textContent = energy;
            document.getElementById("sleepiness").textContent = sleepiness;
            document.getElementById("mood").textContent = getMood();
        }

        function saveData() {
            localStorage.setItem("food", food);
            localStorage.setItem("water", water);
            localStorage.setItem("energy", energy);
            localStorage.setItem("sleepiness", sleepiness);
        }

        function updataMood() {
            food = Math.max(food - 1, 0);
            water = Math.max(water - 1, 0);
            energy = Math.max(energy - 1, 0);
            sleepiness = Math.max(sleepiness + 1, 100);
        }

        function feedDog() {
            food += 10;
            updataDisplay();
            saveData();
        }

        function waterDog() {
            water += 10;
            updataDisplay();
            saveData();
        }

        function walkDog() {
            energy -= 10;
            food -= 10;
            water -= 5;
            sleepiness += 10;
            updataDisplay();
            saveData();
        }

        function sleepDog() {
            sleepiness -= 20;
            energy += 20;
            food -= 10;
            water -= 5;
            updataDisplay();
            saveData();
        }


        function clampStats() {
            food = Math.max(food, 0);
            water = Math.max(water, 0);
            energy = Math.max(energy, 0);
            sleepiness = Math.max(sleepiness, 0);

            food = Math.min(food, 100);
            water = Math.min(water, 100);
            energy = Math.min(energy, 100);
            sleepiness = Math.min(sleepiness, 100);
        }

        function getMood() {
            // 特殊状態
            if (food < 10) return "🤤"
            if (water < 10) return "🥵"
            if (energy < 10) return "😑"
            if (sleepiness > 90) return " 😴"

            if (
                food === 100 &&
                water === 100 &&
                energy === 100 &&
                sleepiness === 0
            ) return "🤩"

            if (
                food === 0 &&
                water === 0 &&
                energy === 0
            ) return "😇"

            if (
                food > 90 &&
                water > 90 &&
                energy < 10
            ) return "🍖"

            // 総合評価
            let moodScore =
                food * 1.5 +
                water * 1.5 +
                energy * 1.0 +
                (100 - sleepiness) * 0.8;

            moodScore += Math.min(
                food,
                water,
                energy,
                (100 - sleepiness)
            );

            if (moodScore < 48) return "😩";
            if (moodScore < 96) return "😔";
            if (moodScore < 144) return "🙁";
            if (moodScore < 192) return "😐";
            if (moodScore < 240) return "🙂";
            if (moodScore < 288) return "😊";
            if (moodScore < 336) return "😄";
            if (moodScore < 384) return "😁";
            return "😆";
        }

        setInterval(() => {
            updataMood()
            updataDisplay()
            saveData()
        }, 10000);

    </script>
</body>

</html>
